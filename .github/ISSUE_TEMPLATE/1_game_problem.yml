        - "Pokémon Shining Pearl 1.3.0 (010018E011D92000)"
        - "Pokémon Sword 1.3.2 (0100ABF008968000)"
        - "Pokémon Violet 4.0.0 (01008F6008C5E000)"
        - "Pokémon: Let's Go, Eevee! 1.0.2 (0100187003A36000)"
        - "Pokémon: Let's Go, Pikachu! 1.0.2 (010003F003A34000)"
