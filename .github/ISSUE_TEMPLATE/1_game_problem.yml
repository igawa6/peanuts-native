# Written by peanuts/scripts/issue_forms.py: change that script, then run it.
name: "Game problem"
description: "A game crashes, freezes, shows a black screen, draws wrong, runs slowly, sounds wrong, or its controls or saves misbehave"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Your device is probably not the one this was tested on, so these details are what a problem is traced with. Most fields are a pick from a list.
        **Adding a game went wrong** (the import, Prepare or the companion)? Use **Build problem**. **Keys, firmware, the library, storage, a driver or companion install, saves import** or the app itself? Use **Setup or app problem**.
        Never attach game files, keys, firmware or anything extracted from a game. Logs, saves and screenshots are fine. Write in English if you can; another language is fine too.
  - type: textarea
    id: what
    attributes:
      label: "What happened"
      description: "What you did and what you saw, and where in the game (a level, a menu, a scene, a race). Text on the screen is worth copying in, word for word."
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: "What goes wrong"
      description: "Pick all that apply."
      multiple: true
      options:
        - "The game closes or crashes"
        - "The game freezes (the picture stops; say whether sound goes on)"
        - "Black or blank screen"
        - "Objects, characters, water or sky are black, missing or invisible"
        - "Flicker, glow, particles or effects look wrong"
        - "Text, menus or videos look wrong"
        - "It runs slowly, stutters or the frame rate drops"
        - "The game runs too fast or too slow (its speed, not the frame rate)"
        - "The device gets hot, or the app says it is too hot"
        - "Sound (crackling, missing, out of sync)"
        - "Controls, gyro or touch"
        - "Saves (not saved, lost, or will not load)"
        - "The companion on the second screen"
        - "Something else (say what in \"What happened\")"
    validations:
      required: true
  - type: dropdown
    id: when
    attributes:
      label: "When"
      options:
        - "When the game starts, before its title screen"
        - "In the game's menus"
        - "While playing"
        - "After playing for a while (minutes or hours)"
        - "After coming back to the game (from Home, or closing and opening the lid)"
        - "Other (say when in \"What happened\")"
    validations:
      required: true
  - type: dropdown
    id: often
    attributes:
      label: "How often"
      options:
        - "Every time"
        - "Sometimes"
        - "Once so far"
    validations:
      required: true
  - type: dropdown
    id: regression
    attributes:
      label: "Did it work before?"
      options:
        - "It never worked, or this is the first try"
        - "It worked in an older app version (say which in \"Anything else\")"
        - "It worked before a game update"
        - "It worked before I changed a setting, the driver or a mod"
        - "I don't know"
    validations:
      required: true
  - type: dropdown
    id: game
    attributes:
      label: "Game and version"
      description: "Every game with every update this app version plays: pick the one the game runs with, as its card shows it. Not listed? Pick one of the last two lines and write it below."
      options:
        - "13 Sentinels: Aegis Rim 1.10 (01003FC01670C000)"
        - "Advance Wars 1+2: Re-Boot Camp 1.0.0 (0100300012F2A000)"
        - "Animal Crossing: New Horizons 3.0.3 (01006F8002326000)"
        - "Astral Chain 1.0.1 (01007300020FA000)"
        - "Captain Toad: Treasure Tracker 1.4.2 (01009BF0072D4000)"
        - "Captain Tsubasa 2: World Fighters 1.0.6 (01009720213B0000)"
        - "Castlevania: Belmont's Curse 1.1.0 (0100BA4026E94000)"
