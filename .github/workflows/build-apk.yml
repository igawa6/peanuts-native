name: Build Dev APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python & .NET
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build patchelf zstd
          pip install "capstone>=5,<6" lz4 zbic==1.0.1.post1

      - name: Build on-device packer stage
        run: |
          chmod +x android/ondevice/build.sh
          mkdir -p /tmp/pn-work
          android/ondevice/build.sh /tmp/pn-work

      - name: Build APK
        run: |
          cd android/app
          chmod +x gradlew
          ./gradlew -PnxPackStage=/tmp/pn-work/stage apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: peanuts-native-dev-apk
          path: android/app/out/*.apk
