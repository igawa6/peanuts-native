name: Build Peanuts Test APK

on:
  push:
    branches: [octopath1-test-apk]
  workflow_dispatch:
    inputs:
      games:
        description: 'Comma-separated Title IDs to include'
        required: true
        default: '010057D006492000'
      app_id_suffix:
        description: 'App ID suffix (dev.nxnative.android.<suffix>)'
        required: true
        default: 'peanutstest'

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build tools (zsh, ninja)
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh ninja-build

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.114'

      - name: Install Python fonttools
        run: python3 -m pip install --break-system-packages fonttools

      - name: Install Android SDK, NDK 28.2.13676358 & CMake 3.22.1
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Build on-device packer stage
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          ANDROID_NDK_HOME="$SDK_ROOT/ndk/28.2.13676358" \
            zsh peanuts/scripts/ondevice-stage.sh /tmp/peanuts-stage

      - name: Build side-by-side Peanuts test APK with in-app builder
        working-directory: android/app
        env:
          GAMES: ${{ github.event.inputs.games || '010057D006492000' }}
          APP_SUFFIX: ${{ github.event.inputs.app_id_suffix || 'peanutstest' }}
        run: |
          ./gradlew apk \
            -PnxApp=peanuts \
            -PnxAppId="$APP_SUFFIX" \
            -PnxLabel="Peanuts test" \
            -PnxGames="$GAMES" \
            -PnxPackStage=/tmp/peanuts-stage/stage

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: peanuts-test-apk-${{ github.event.inputs.games || '010057D006492000' }}
          path: android/app/out/nxnative-android-peanuts.apk
          if-no-files-found: error
