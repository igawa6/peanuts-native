name: Peanuts Native BUILD MASTER

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/android-beta.yml'
      - 'android/**'
      - 'dm/**'
      - 'peanuts/**'
      - 'scripts/**'
      - 'CMakeLists.txt'
      - 'pyproject.toml'
  workflow_dispatch:
    inputs:
      app_id:
        description: App id suffix (lower-case letters and digits); one id for every module's app, so each one updates the one before (PEANUTS)
        default: "master"
      host_opt:
        description: Optimization level of the host's C (1, 2, 3 or fast = -Ofast without finite-math-only; PEANUTS)
        default: "fast"
      host_lto:
        description: ThinLTO of the host's C (ON or OFF; PEANUTS)
        default: "ON"

permissions:
  contents: write   # PEANUTS: the APK is also published as a release asset

concurrency:
  group: peanuts-android-beta-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build S22-targeted Master APK
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up .NET 10 NativeAOT toolchain
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Configure preinstalled Android SDK
        shell: bash
        run: |
          SDK_ROOT="$HOME/Library/Android/sdk"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "Android SDK command-line tools not found at $SDKMANAGER"
            find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -name sdkmanager -print 2>/dev/null || true
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "ndk;27.2.12479018" "platforms;android-35" "build-tools;35.0.0"

      - name: Install native build tools
        run: brew install cmake ninja

      - name: Build Android native stage
        shell: zsh {0}
        run: |
          setopt pipefail
          zsh android/ondevice/build.sh "$RUNNER_TEMP/peanuts-native-work" 2>&1 | tee "$RUNNER_TEMP/stage.log"

      - name: Build Peanuts Native Master APK with all Android-ready game profiles
        shell: bash
        run: |
          cd android/app
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --stacktrace \
            -PnxApp=peanuts \
            -PnxAppId="${{ inputs.app_id || 'master' }}" \
            -PnxHostOpt="${{ inputs.host_opt || 'fast' }}" \
            -PnxHostLto="${{ inputs.host_lto || 'ON' }}" \
            -PnxPackStage="$RUNNER_TEMP/peanuts-native-work/stage" \
            apk 2>&1 | tee "$RUNNER_TEMP/gradle.log"

      # PEANUTS: on a failed build, the errors of the logs as an annotation (readable through the API by clients that cannot fetch the log itself)
      - name: Show the build errors
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, os, re
          out = []
          for f in sorted(glob.glob(os.environ["RUNNER_TEMP"] + "/*.log")):
              lines = open(f, errors="replace").read().splitlines()
              hit = [l[:260] for l in lines if re.search(r"error:|FAILED|What went wrong|Execution failed|undefined reference|fatal error|\[RED\]|No such file|not found|Could not", l, re.I)][:25]
              out.append("== " + os.path.basename(f) + " (" + str(len(lines)) + " lines)")
              out += hit
              out.append("-- tail --")
              out += [l[:240] for l in lines[-20:]]
          msg = "\n".join(out)[:60000].replace("%", "%25").replace("\r", "").replace("\n", "%0A")
          print("::error title=build errors::" + msg)
          PY

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          APK="$(find android/app -type f -name '*.apk' -path '*/out/*' | head -n 1)"
          if [ -z "$APK" ]; then
            echo "No APK found under android/app/**/out/"
            find android/app -type f -name '*.apk' -print
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "Found: $APK"

      - name: Upload installable BUILD MASTER APK
        uses: actions/upload-artifact@v4
        with:
          name: peanuts-native-build-master-s22
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14

      # PEANUTS: a link to download the APK without the Actions artifact zip
      - name: Publish the APK as a release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="${{ steps.apk.outputs.path }}"
          TAG="master-${{ github.run_number }}"
          gh release create "$TAG" "$APK" --target "${{ github.sha }}" \
            --title "Master build $TAG" --notes "BUILD MASTER of ${{ github.ref_name }} at ${{ github.sha }}"
